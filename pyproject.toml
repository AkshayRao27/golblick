[project]
name = "insta360-tools"
version = "0.1.0"
description = "Read, inspect and triage Insta360 .insp and .insv files on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["insta360", "360", "equirectangular", "fisheye", "nextcloud"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
# The library and CLI are deliberately dependency-free: the whole point is that
# they run anywhere, including inside a container, without a toolchain.
dependencies = []

[project.optional-dependencies]
# Needed only for rendering, which is not part of this release.
render = ["numpy>=1.24", "pillow>=10.0"]

[project.scripts]
insta360 = "insta360.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insta360"]

[tool.pytest.ini_options]
testpaths = ["tests"]
