[project]
name = "golblick"
version = "0.3.0"
description = "Read, inspect and render 360 camera files on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["360", "equirectangular", "fisheye", "panorama", "insta360", "nextcloud"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
# The library and CLI are deliberately dependency-free: the whole point is that
# they run anywhere, including inside a container, without a toolchain.
dependencies = []

[project.optional-dependencies]
# Needed only for rendering; everything else runs without it.
render = ["numpy>=1.24", "pillow>=10.0"]

[project.scripts]
golblick = "golblick.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golblick"]

# The Nextcloud app is released separately; without this the sdist picks up
# its node_modules, which only the app's own .gitignore excludes.
[tool.hatch.build.targets.sdist]
exclude = ["nextcloud-app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# numpy is skipped for, not imported, before the modules that need it.
"tests/test_render.py" = ["E402"]
