name: Camera report
description: A file golblick reads wrongly or not at all, or a camera it hasn't been tested on
labels: ["camera"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. `golblick report` leaves out the file's name, its folder and the camera's serial number, so its output is safe to paste here. Please don't attach whole photos unless you're happy for them to be public; a crop is usually enough.
  - type: input
    id: camera
    attributes:
      label: Camera model and firmware
      placeholder: Insta360 X4, v1.2.3
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of golblick report
      description: Run `golblick report <file>` on one or more of the files and paste the output. In the Nextcloud app, a `.insp` file's actions menu in Files has a "Camera report" entry that shows the same thing.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. For a render, say whether it's upright, mirrored, or broken where the two lenses meet.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Command-line tool
        - Nextcloud app
        - Both
    validations:
      required: true
