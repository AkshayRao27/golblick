name: Release

# Publishing a GitHub release uploads the Python package to PyPI, and builds the
# AppImage and attaches it to the release. PyPI trusts this workflow by name (a
# trusted publisher), so no token is stored anywhere.
#
# Run by hand with a release's tag, it builds and attaches only the AppImage,
# for a release whose AppImage failed or is missing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the published release to attach the AppImage to
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: The tag names the version being built
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          case "${GITHUB_REF_NAME#v}" in
            "$version" | "$version"-*) ;;
            *) echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"; exit 1 ;;
          esac
      - name: Point the README's relative links at GitHub, for the PyPI page
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import pathlib, re, sys
          tag = sys.argv[1]
          repo = "https://github.com/AkshayRao27/golblick"
          readme = pathlib.Path("README.md")
          text = readme.read_text()
          text = re.sub(r'src="(?!https?:)([^"]+)"', rf'src="https://raw.githubusercontent.com/AkshayRao27/golblick/{tag}/\1"', text)
          text = re.sub(r"\]\((?!https?:|#|mailto:)([^)]+)\)", rf"]({repo}/blob/{tag}/\1)", text)
          readme.write_text(text)
          EOF
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  appimage:
    # After the version check in build, so a mismatched tag uploads nothing.
    # Run by hand, build is skipped and the check below stands in for it.
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v10.3.2
      - name: The tag names the version being built
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          case "${TAG#v}" in
            "$version" | "$version"-*) ;;
            *) echo "Tag $TAG doesn't match version $version in pyproject.toml"; exit 1 ;;
          esac
      - name: Libraries Qt needs to draw the icon offscreen
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: packaging/appimage/build.sh
      - name: The AppImage starts, and its viewer imports
        run: |
          image=$(ls build/appimage/out/*.AppImage)
          "$image" --appimage-extract-and-run vendors
          "$image" --appimage-extract >/dev/null
          QT_QPA_PLATFORM=offscreen squashfs-root/usr/python/bin/python3 -I -c "import golblick.viewer"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/appimage/out/*.AppImage build/appimage/out/*.zsync --clobber

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/golblick/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
